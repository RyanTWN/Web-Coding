services:
  cool-learning-web:
    image: ghcr.io/ryantwn/web-coding-frontend:${IMAGE_TAG:-latest}
    container_name: cool-learning-web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/english.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  cool-learning-api:
    image: ghcr.io/ryantwn/web-coding-backend:${IMAGE_TAG:-latest}
    container_name: cool-learning-api
    ports:
      - "${API_PORT:-4060}:4060"
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4060/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
