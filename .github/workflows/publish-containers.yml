name: Build and publish website containers

on:
  push:
    branches: [main]
    paths:
      - "cool_learning/**"
      - "cool_learning_backend/**"
      - ".github/workflows/publish-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-nas
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./cool_learning
            file: ./cool_learning/Dockerfile
            image: ghcr.io/ryantwn/web-coding-frontend
          - name: backend
            context: ./cool_learning_backend
            file: ./cool_learning_backend/Dockerfile
            image: ghcr.io/ryantwn/web-coding-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Synology NAS
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NAS_SSH_KEY" > ~/.ssh/nas_deploy_key
          chmod 600 ~/.ssh/nas_deploy_key
          if [ -n "$NAS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$NAS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$NAS_PORT" -H "$NAS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
        run: |
          deploy_path="${NAS_DEPLOY_PATH:-/volume1/docker/cool_learning_backend}"
          ssh -i ~/.ssh/nas_deploy_key -p "$NAS_PORT" "$NAS_USER@$NAS_HOST" "mkdir -p '$deploy_path'"
          scp -i ~/.ssh/nas_deploy_key -P "$NAS_PORT" \
            cool_learning_backend/compose.yaml cool_learning_backend/deploy-nas.sh \
            cool_learning_backend/deploy-nas-cicd.sh \
            "$NAS_USER@$NAS_HOST:$deploy_path/"

      - name: Deploy immutable image and verify health
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
        run: |
          deploy_path="${NAS_DEPLOY_PATH:-/volume1/docker/cool_learning_backend}"
          ssh -i ~/.ssh/nas_deploy_key -p "$NAS_PORT" "$NAS_USER@$NAS_HOST" \
            "chmod 700 '$deploy_path/deploy-nas.sh' '$deploy_path/deploy-nas-cicd.sh' && cd '$deploy_path' && ./deploy-nas.sh 'sha-${GITHUB_SHA}'"
